<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>SGE-NG - A carregar...</title>
    <script>
      // Redirecionamento SPA seguro para GitHub Pages (preserva subpastas /<repo>/ e /docs/)
      (function () {
        var l = window.location;
        var base = l.pathname;
        if (base.indexOf('/docs/') !== -1) {
          base = base.slice(0, base.indexOf('/docs/') + 6);
        } else {
          base = base.replace(/\/[^/]*$/, '/');
        }
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + l.search + l.hash);
      })();
    </script>
  </head>
  <body>
    <p>A redirecionar para a página inicial do SGE-NG...</p>
  </body>
</html>
