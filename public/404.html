<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>SGE-NG - A carregar...</title>
    <script>
      // Redirecionamento SPA seguro para raiz (/), /docs/ e /documentos
      (function () {
        var l = window.location;
        var path = l.pathname || '/';
        var base = path;
        try {
          if (/\/documentos\/?$/i.test(path)) {
            sessionStorage.setItem('sge_entry_route', 'documentos');
          }
        } catch (e) {}
        if (/\/documentos\/?$/i.test(path)) {
          base = path.replace(/\/documentos\/?$/i, '/');
        } else if (path.indexOf('/docs/') !== -1) {
          base = path.slice(0, path.indexOf('/docs/') + 6);
        } else if (/\/docs$/i.test(path)) {
          base = path + '/';
        } else {
          base = path.replace(/\/[^/]*$/, '/');
        }
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + (base || '/') + l.search + l.hash);
      })();
    </script>
  </head>
  <body>
    <p>A redirecionar para a página inicial do SGE-NG...</p>
  </body>
</html>
