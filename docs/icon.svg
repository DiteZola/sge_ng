<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#071626" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="100" fill="url(#gradBg)" />
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="url(#gradGold)" stroke-width="8" opacity="0.4" />

  <!-- Shield Shape -->
  <path d="M 256 70 L 380 130 C 380 270 256 370 256 420 C 256 370 132 270 132 130 Z" fill="#1E3A8A" opacity="0.3" stroke="url(#gradGold)" stroke-width="6" />

  <!-- Open Book Base -->
  <g transform="translate(146, 210)">
    <!-- Book Pages Left -->
    <path d="M 110 90 C 80 80 30 75 0 90 L 0 160 C 30 145 80 150 110 165 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Book Pages Right -->
    <path d="M 110 90 C 140 80 190 75 220 90 L 220 160 C 190 145 140 150 110 165 Z" fill="#F3F4F6" />
    <!-- Spine Line -->
    <line x1="110" y1="85" x2="110" y2="170" stroke="url(#gradGold)" stroke-width="4" />
  </g>

  <!-- Academic Graduation Cap / Torch -->
  <g transform="translate(256, 175)">
    <!-- Mortarboard cap top -->
    <polygon points="0,-40 70,-15 0,10 -70,-15" fill="url(#gradGold)" />
    <!-- Skull cap -->
    <path d="M -40,-8 L -40,15 C -40,30 40,30 40,15 L 40,-8 Z" fill="#B45309" />
    <!-- Tassel -->
    <path d="M 0,-15 Q 50,5 55,30" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <circle cx="55" cy="32" r="5" fill="#EF4444" />
  </g>

  <!-- Star of Angola / Excellence -->
  <polygon points="256,95 264,113 284,114 268,126 274,145 256,133 238,145 244,126 228,114 248,113" fill="url(#gradGold)" />

  <!-- Text SGE-NG -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF">SGE-NG</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="3" fill="#FBBF24">MINED · ANGOLA</text>
</svg>
